name: iOS
on:
  push:
  pull_request:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build application
        run: |
          xcodebuild build -project Pedy.xcodeproj -scheme Pedy -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device application
        run: |
          xcodebuild build -project Pedy.xcodeproj -scheme Pedy -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/pedy-build" CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/pedy-ipa/Payload"
          cp -R "$RUNNER_TEMP/pedy-build/Build/Products/Release-iphoneos/Pedy.app" "$RUNNER_TEMP/pedy-ipa/Payload/Pedy.app"
          cd "$RUNNER_TEMP/pedy-ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Pedy-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pedy-unsigned-ipa
          path: Pedy-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Run planner tests
        timeout-minutes: 10
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')"
          xcodebuild test -project Pedy.xcodeproj -scheme Pedy -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
