name: Pedy
options:
  bundleIdPrefix: pl.pedy
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  Pedy:
    type: application
    platform: iOS
    sources:
      - path: Pedy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.pedy.app
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.6
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: Pedy
        INFOPLIST_KEY_CFBundleName: Pedy
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: NO
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Pędy używa wybranego zdjęcia wyłącznie do lokalnego rozpoznania rośliny i diagnozy.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    scheme:
      testTargets:
        - PedyTests
  PedyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PedyTests
    dependencies:
      - target: Pedy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.pedy.tests
        GENERATE_INFOPLIST_FILE: YES
